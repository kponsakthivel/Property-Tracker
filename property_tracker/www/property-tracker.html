<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Property Tracker</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="icon" href="/assets/property_tracker/images/logo.svg" type="image/svg+xml">
	<link rel="manifest" href="/property-tracker.webmanifest">
	<meta name="theme-color" content="#1f6f50">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Properties">
	<link rel="apple-touch-icon" href="/assets/property_tracker/images/apple-touch-icon.png">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
	<link rel="stylesheet" href="/assets/property_tracker/css/property_tracker.css?v={{ build_version }}">
	<script>
		window.csrf_token = "{{ csrf_token }}";
		try {
			var t = localStorage.getItem("theme");
			if (t && t !== "auto") document.documentElement.setAttribute("data-theme", t);
		} catch (e) {}
	</script>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
	<div id="ld"></div>
	<div id="app"><main id="m"></main><nav id="nav"></nav></div>
	<div id="sh"></div>
	<div id="toast" class="toast" hidden></div>
	<script src="/assets/property_tracker/js/property_tracker.js?v={{ build_version }}"></script>
	<script>
		if ("serviceWorker" in navigator) {
			navigator.serviceWorker.register("/property-tracker-sw.js", { scope: "/property-tracker" }).catch(function () {});
		}
	</script>
</body>
</html>
