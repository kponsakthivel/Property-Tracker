<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Property Tracker</title>
	<script src="config.js"></script>
	<style>
		:root { --bg: #f6f5f2; --ink: #1d2320; --mut: #6b746f; --ac: #1f6f50; }
		@media (prefers-color-scheme: dark) { :root { --bg: #121513; --ink: #eef1ee; --mut: #9aa59f; --ac: #4cc38a; } }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
			font: 16px/1.5 system-ui, -apple-system, Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
		p { color: var(--mut); }
		button { background: var(--ac); color: #fff; border: 0; border-radius: 12px; padding: 14px 24px; font: inherit; font-weight: 600; }
	</style>
</head>
<body>
	<div>
		<h2>Can't reach the server</h2>
		<p>Property Tracker needs an internet connection to load your properties.<br><span id="site"></span></p>
		<button onclick="retry()">Try again</button>
	</div>
	<script>
		document.getElementById("site").textContent = window.SITE_URL || "";
		function retry() { location.href = (window.SITE_URL || "") + "/property-tracker"; }
	</script>
</body>
</html>
