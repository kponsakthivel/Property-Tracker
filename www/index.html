<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Site Visit Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--card:#fff;--ink:#1d2320;--mut:#6b746f;--line:#e4e2dc;--ac:#1f6f50;--acf:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121513;--card:#1b201d;--ink:#eef1ee;--mut:#9aa59f;--line:#2a312d;--ac:#4cc38a;--acf:#06130c}}
:root[data-theme="dark"]{--bg:#121513;--card:#1b201d;--ink:#eef1ee;--mut:#9aa59f;--line:#2a312d;--ac:#4cc38a;--acf:#06130c}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;min-height:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button b{font-size:18px}nav button.on{color:var(--ac);font-weight:700}
main{flex:1;padding:14px 14px 140px;max-width:1100px;margin:0 auto;width:100%}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat{cursor:pointer}.stat b{font-size:26px;display:block}.stat span{color:var(--mut);font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acf);border:0;border-radius:30px;padding:16px 22px;font-weight:700;font-size:16px;box-shadow:0 4px 14px #0003;z-index:6}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}.btn.d{color:#c0392b}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;margin:3px 0 8px}
label{font-size:12px;color:var(--mut)}.row{display:flex;gap:8px}.row>*{flex:1}.wrap{flex-wrap:wrap}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;background:var(--c)}
.item{display:flex;gap:10px;margin-bottom:10px;cursor:pointer}.item img,.ph{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--line);flex:none;display:grid;place-items:center}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px 14px 100px}
.sheet .in{max-width:760px;margin:0 auto}.mut{color:var(--mut);font-size:13px}
.ph2{display:flex;gap:6px;overflow:auto}.ph2 img{height:90px;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}.diff{background:#e9b94455}
.scroll{overflow:auto}svg text{fill:var(--mut);font-size:11px}
@media(min-width:800px){nav{position:static;flex-direction:column;width:200px;border:0;border-right:1px solid var(--line);padding:16px 8px;height:100vh;position:sticky;top:0}
nav button{flex-direction:row;font-size:14px;gap:10px;padding:12px;justify-content:flex-start}.grid{grid-template-columns:repeat(5,1fr)}#app{flex-direction:row-reverse}main{padding-bottom:40px}.fab{bottom:24px}}
</style></head><body><div id="app"><main id="m"></main><nav id="nav"></nav></div><div id="sh"></div>
<script>
const ST=["New","Visited","Shortlisted","Follow-up","Negotiating","Revisit Required","Document Verification","Final Discussion","Purchased","Rejected","On Hold"];
const SC={New:[210,10],Visited:[210,60],Shortlisted:[45,90],"Follow-up":[280,50],Negotiating:[25,85],"Revisit Required":[330,60],"Document Verification":[190,70],"Final Discussion":[260,50],Purchased:[145,60],Rejected:[0,70],"On Hold":[0,0]};
const SI={New:"○",Visited:"●",Shortlisted:"★",Purchased:"✔",Rejected:"✖",Negotiating:"₹","On Hold":"⏸"};
const col=s=>{const c=SC[s]||[0,0];return `hsl(${c[0]} ${c[1]}% 38%)`};
const pill=s=>`<span class="pill" style="--c:${col(s)}">${SI[s]||"•"} ${s}</span>`;
const U={"Sq.ft":1,Cent:435.6,Acre:43560,Ground:2400,"Sq.m":10.764};
let db={props:[],rem:[]},view="home",flt="",q="",cmp=[],sync="Synced";
try{db=JSON.parse(localStorage.getItem("stt")||"")||db}catch(e){}
function save(){try{localStorage.setItem("stt",JSON.stringify(db))}catch(e){alert("Storage full — delete some photos or export a backup.")}}
const $=id=>document.getElementById(id),P=id=>db.props.find(p=>p.id==id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=n=>n?"₹"+Math.round(n).toLocaleString("en-IN"):"—";
const sqft=p=>p.area?p.area*(U[p.unit]||1):(p.len&&p.wid?p.len*p.wid:0);
const total=p=>{if(!p.price)return 0;if(p.punit=="Total")return +p.price;const f={"Per Cent":435.6,"Per Sq.ft":1,"Per Acre":43560,"Per Ground":2400}[p.punit];return p.price*sqft(p)/f};
const psf=p=>sqft(p)&&total(p)?total(p)/sqft(p):0,pc=p=>psf(p)*435.6;
const gm=p=>`https://www.google.com/maps?q=${p.lat},${p.lng}`;
const now=()=>new Date().toISOString();const dt=s=>s?new Date(s).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):"—";
const same=(s,d)=>s&&new Date(s).toDateString()==d.toDateString();
function nav(v){view=v;flt="";render()}
function render(){
 $("nav").innerHTML=[["home","⌂","Home"],["list","☰","Properties"],["map","⌖","Map"],["rem","⏰","Reminders"],["more","⋯","More"]].map(([v,i,t])=>`<button class="${view==v?"on":""}" onclick="nav('${v}')"><b>${i}</b>${t}</button>`).join("");
 $("m").innerHTML=({home,list,map,rem,more})[view]()+`<button class="fab" onclick="edit()">+ ADD PROPERTY</button>`;
}
function home(){const t=new Date(),wk=new Date(Date.now()-6048e5),c=f=>db.props.filter(f).length,s=x=>c(p=>p.status==x);
 const due=db.rem.filter(r=>!r.done&&new Date(r.due)<=new Date(Date.now()+864e5)).length;
 const card=(n,l,f)=>`<div class="card stat" onclick="flt='${f}';view='list';render()"><b>${n}</b><span>${l}</span></div>`;
 const pr=db.props.filter(p=>total(p)),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
 const loc={};db.props.forEach(p=>{const k=p.locality||p.district||"Unknown";loc[k]=(loc[k]||0)+1});
 return `<h1>Site Visits</h1><div class="grid">${card(c(p=>same(p.created,t)),"Visited Today","")}${card(c(p=>new Date(p.created)>wk),"This Week","")}${card(s("Shortlisted"),"Shortlisted","Shortlisted")}${card(s("Negotiating"),"Negotiating","Negotiating")}${card(s("Document Verification"),"Document Verification","Document Verification")}${card(s("Revisit Required"),"Site Revisit","Revisit Required")}${card(s("Purchased"),"Purchased","Purchased")}${card(s("Rejected"),"Rejected","Rejected")}<div class="card stat" onclick="nav('rem')"><b>${due}</b><span>Follow-ups Due</span></div><div class="card stat"><b>${db.props.length}</b><span>Total Visited</span></div></div>
 <h2>Averages</h2><div class="card">Price: <b>${inr(avg(pr.map(total)))}</b> · per cent: <b>${inr(avg(pr.map(pc).filter(x=>x)))}</b> · per sq.ft: <b>${inr(avg(pr.map(psf).filter(x=>x)))}</b></div>
 <h2>By Location</h2><div class="card">${Object.entries(loc).map(([k,v])=>`${esc(k)}: <b>${v}</b>`).join(" · ")||'<span class="mut">No data yet</span>'}</div>
 <h2>Recent Visits</h2>${db.props.slice(-5).reverse().map(item).join("")||'<div class="card mut">Tap + ADD PROPERTY at your first site.</div>'}`}
function item(p){return `<div class="card item" onclick="detail('${p.id}')">${p.photos?.[0]?`<img src="${p.photos[0].d}">`:'<div class="ph">🏞</div>'}<div style="flex:1;min-width:0"><b>${p.id}</b> ${esc(p.name||"")} ${pill(p.status)}<div class="mut">${esc(p.locality||"")} ${esc(p.type)} · ${p.area||"—"} ${p.unit} · ${p.facing||""}</div><div>${inr(total(p))} <span class="mut">${psf(p)?"· "+inr(pc(p))+"/cent":""}</span></div><div class="mut">Last visit ${dt(p.visits.length?p.visits.at(-1).at:p.created)}</div></div></div>`}
function list(){let r=db.props.filter(p=>(!flt||p.status==flt)&&(!q||JSON.stringify([p.id,p.name,p.locality,p.district,p.owner,p.broker,p.type]).toLowerCase().includes(q.toLowerCase())));
 return `<h1>Properties</h1><div class="row"><input placeholder="Search location, owner, ID…" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.t);window.t=setTimeout(render,300)"><select onchange="flt=this.value;render()"><option value="">All statuses</option>${ST.map(s=>`<option ${s==flt?"selected":""}>${s}</option>`).join("")}</select></div>
 <div class="row wrap" style="margin-bottom:10px"><button class="btn" onclick="compare()">⇄ Compare selected (${cmp.length})</button><button class="btn" onclick="near()">📍 Nearest first</button></div>
 ${r.map(p=>`<div style="display:flex;gap:6px;align-items:flex-start"><input type="checkbox" style="width:22px;margin-top:30px" ${cmp.includes(p.id)?"checked":""} onchange="tgl('${p.id}')"><div style="flex:1">${item(p)}</div></div>`).join("")||'<div class="card mut">No properties match.</div>'}`}
function tgl(id){cmp=cmp.includes(id)?cmp.filter(x=>x!=id):[...cmp,id].slice(-5)}
function near(){navigator.geolocation?.getCurrentPosition(g=>{const d=p=>hav(g.coords.latitude,g.coords.longitude,p.lat,p.lng);db.props.sort((a,b)=>d(a)-d(b));render()},()=>alert("Location unavailable"))}
function hav(a,b,c,d){if(c==null||c==="")return 1e9;const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function map(){const ps=db.props.filter(p=>p.lat!==""&&p.lat!=null);
 if(!ps.length)return `<h1>Map</h1><div class="card mut">No located properties yet.</div>`;
 const la=ps.map(p=>+p.lat),lo=ps.map(p=>+p.lng),a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo),W=700,H=460,x=v=>40+(d==c?.5:(v-c)/(d-c))*(W-80),y=v=>H-40-(b==a?.5:(v-a)/(b-a))*(H-80);
 const f=flt;return `<h1>Map</h1><div class="row wrap" style="margin-bottom:8px"><button class="btn" onclick="flt='';render()">All</button>${["Visited","Shortlisted","Negotiating","Purchased","Rejected"].map(s=>`<button class="btn" onclick="flt='${s}';render()">${SI[s]} ${s}</button>`).join("")}<button class="btn" onclick="me()">My location</button></div>
 <div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%" style="background:var(--bg);border-radius:10px">${ps.filter(p=>!f||p.status==f).map(p=>`<g onclick="detail('${p.id}')" style="cursor:pointer"><circle cx="${x(p.lng)}" cy="${y(p.lat)}" r="15" fill="${col(p.status)}"/><text x="${x(p.lng)}" y="${y(p.lat)+4}" text-anchor="middle" style="fill:#fff;font-weight:700">${SI[p.status]||"•"}</text><text x="${x(p.lng)}" y="${y(p.lat)+30}" text-anchor="middle">${p.id}</text></g>`).join("")}</svg>
 <div class="mut">Relative layout of saved pins (works offline). Tap a pin for details and “Open in Google Maps”.</div></div>`}
function me(){navigator.geolocation?.getCurrentPosition(g=>window.open(`https://www.google.com/maps?q=${g.coords.latitude},${g.coords.longitude}`),()=>alert("Location unavailable"))}
function rem(){const rs=[...db.rem].sort((a,b)=>a.due.localeCompare(b.due));
 return `<h1>Reminders</h1><div class="card"><label>Reminder</label><input id="rt" placeholder="Call owner, check EC…"><div class="row"><div><label>Due</label><input id="rd" type="datetime-local"></div><div><label>Property</label><select id="rp"><option value="">—</option>${db.props.map(p=>`<option>${p.id}</option>`).join("")}</select></div></div><button class="btn p" onclick="addRem()">Add reminder</button></div><h2>Upcoming</h2>
 ${rs.map(r=>`<div class="card" style="margin-bottom:8px;opacity:${r.done?.5:1}"><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px"><input type="checkbox" style="width:22px;margin:0" ${r.done?"checked":""} onchange="db.rem.find(x=>x.k==${r.k}).done=this.checked;save();render()"> ${esc(r.t)}</label><div class="mut">${dt(r.due)} ${r.p?"· "+r.p:""} ${!r.done&&new Date(r.due)<new Date()?"· <b style='color:#c0392b'>Overdue</b>":""}</div></div>`).join("")||'<div class="mut">None yet.</div>'}`}
function addRem(){const t=$("rt").value.trim(),d=$("rd").value;if(!t||!d)return alert("Enter text and date");db.rem.push({k:Date.now(),t,due:new Date(d).toISOString(),p:$("rp").value,done:false});save();render();try{Notification.requestPermission()}catch(e){}}
setInterval(()=>{try{db.rem.filter(r=>!r.done&&!r.n&&new Date(r.due)<=new Date()).forEach(r=>{r.n=1;save();if(Notification.permission=="granted")new Notification("Reminder",{body:r.t})})}catch(e){}},30000);
function more(){return `<h1>More</h1><div class="card"><b>Data & sync</b><p class="mut">Status: <b>${sync}</b> — all data is saved on this device instantly and works offline. Cloud account sync needs a backend, which this standalone page doesn't include.</p>
 <div class="row wrap"><button class="btn" onclick="csv()">Export CSV (Excel)</button><button class="btn" onclick="bak()">Backup JSON</button><label class="btn">Restore<input type="file" accept=".json" hidden onchange="rest(this)"></label></div></div>
 <h2>Status colour key</h2><div class="card">${ST.map(pill).join(" ")}</div>`}
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function csv(){const h=["ID","Name","Type","Locality","District","Status","Area","Unit","Length","Width","RoadWidth","Facing","Owner","Phone","Price","PriceUnit","TotalPrice","PerCent","PerSqft","Lat","Lng","Map","Notes"];
 const r=db.props.map(p=>[p.id,p.name,p.type,p.locality,p.district,p.status,p.area,p.unit,p.len,p.wid,p.road,p.facing,p.owner,p.phone,p.price,p.punit,Math.round(total(p)),Math.round(pc(p)),Math.round(psf(p)),p.lat,p.lng,gm(p),p.notes]);
 dl("properties.csv",[h,...r].map(a=>a.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv")}
function bak(){dl("backup.json",JSON.stringify(db),"application/json")}
function rest(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{db=JSON.parse(t);save();render()}catch(e){alert("Invalid file")}})}
function compare(){if(cmp.length<2)return alert("Select 2–5 properties");const ps=cmp.map(P);
 const rows=[["Location",p=>p.locality],["Type",p=>p.type],["Area",p=>p.area?p.area+" "+p.unit:""],["Length",p=>p.len],["Width",p=>p.wid],["Road width",p=>p.road],["Facing",p=>p.facing],["Price",p=>inr(total(p))],["Per cent",p=>inr(pc(p))],["Per sq.ft",p=>inr(psf(p))],["Owner",p=>p.owner],["Rating",p=>p.rating||""],["Status",p=>p.status],["Notes",p=>p.notes]];
 sheet(`<h1>Compare</h1><div class="scroll"><table><tr><th></th>${ps.map(p=>`<th>${p.id}</th>`).join("")}</tr>${rows.map(([l,f])=>{const v=ps.map(f),d=new Set(v.map(String)).size>1;return `<tr><td><b>${l}</b></td>${v.map(x=>`<td class="${d?"diff":""}">${esc(x)}</td>`).join("")}</tr>`}).join("")}</table></div><p class="mut">Highlighted rows differ between properties.</p><button class="btn" onclick="closeS()">Close</button>`)}
function sheet(h){$("sh").innerHTML=`<div class="sheet"><div class="in">${h}</div></div>`}
function closeS(){$("sh").innerHTML="";render()}
let draft;
function edit(){draft={photos:[],lat:"",lng:""};
 sheet(`<h1>Quick add</h1><div class="card"><div id="gps" class="mut">Getting GPS…</div><div class="row"><div><label>Latitude</label><input id="lat" type="number" step="any"></div><div><label>Longitude</label><input id="lng" type="number" step="any"></div></div><button class="btn" onclick="gps()">↻ Recapture GPS</button></div>
 <div class="card" style="margin-top:10px"><label>Property type</label><select id="type">${["Vacant Land","Agricultural Land","Residential Land","House","Apartment","Commercial Property","Industrial Property","Farm Property","Other"].map(t=>`<option>${t}</option>`).join("")}</select>
 <label>Locality / village</label><input id="loc"><label>Photos</label><input id="ph" type="file" accept="image/*" capture="environment" multiple onchange="photos(this)"><div id="pv" class="ph2"></div>
 <div class="row"><div><label>Area</label><input id="area" type="number" step="any" inputmode="decimal"></div><div><label>Unit</label><select id="unit">${Object.keys(U).map(u=>`<option>${u}</option>`).join("")}</select></div></div>
 <div class="row"><div><label>Length</label><input id="len" type="number" inputmode="decimal"></div><div><label>Width</label><input id="wid" type="number" inputmode="decimal"></div><div><label>Road width</label><input id="road" type="number" inputmode="decimal"></div></div>
 <label>Facing</label><select id="face"><option value="">—</option>${["North","South","East","West","North East","North West","South East","South West"].map(t=>`<option>${t}</option>`).join("")}</select>
 <div class="row"><div><label>Owner</label><input id="own"></div><div><label>Phone</label><input id="tel" type="tel"></div></div>
 <div class="row"><div><label>Expected price</label><input id="pr" type="number" inputmode="decimal"></div><div><label>Price unit</label><select id="pu">${["Total","Per Cent","Per Sq.ft","Per Acre","Per Ground"].map(t=>`<option>${t}</option>`).join("")}</select></div></div>
 <label>Notes</label><textarea id="nt" rows="3"></textarea></div>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="closeS()">Cancel</button><button class="btn p" onclick="saveP()">SAVE</button></div>`);gps()}
function gps(){const g=$("gps");navigator.geolocation?navigator.geolocation.getCurrentPosition(r=>{$("lat").value=r.coords.latitude.toFixed(6);$("lng").value=r.coords.longitude.toFixed(6);g.textContent="GPS captured ±"+Math.round(r.coords.accuracy)+" m · "+dt(now())},()=>g.textContent="GPS unavailable — type coordinates manually",{enableHighAccuracy:true,timeout:10000}):g.textContent="GPS not supported"}
function photos(i){[...i.files].forEach(f=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",.6);draft.photos.push({d,at:f.lastModified?new Date(f.lastModified).toISOString():now()});$("pv").innerHTML+=`<img src="${d}">`};im.src=u})}
function saveP(){const v=i=>$(i).value.trim(),n=Math.max(0,...db.props.map(p=>+p.id.slice(1)))+1;
 const p={id:"P"+String(n).padStart(4,"0"),type:v("type"),locality:v("loc"),lat:v("lat"),lng:v("lng"),area:+v("area")||"",unit:$("unit").value,len:+v("len")||"",wid:+v("wid")||"",road:v("road"),facing:$("face").value,owner:v("own"),phone:v("tel"),price:+v("pr")||"",punit:$("pu").value,notes:v("nt"),photos:draft.photos,status:"Visited",created:now(),visits:[],history:[{at:now(),from:"",to:"Visited",note:"Created"}],rating:""};
 if(!p.area&&p.len&&p.wid&&p.unit=="Sq.ft")p.area=p.len*p.wid;
 db.props.push(p);save();sync="Synced";closeS()}
function detail(id){const p=P(id);if(!p)return;
 sheet(`<button class="btn" onclick="closeS()">← Back</button><h1>${p.id} ${pill(p.status)}</h1><div class="mut">${esc(p.locality)} · ${esc(p.type)} · added ${dt(p.created)}</div>
 <div class="ph2" style="margin:10px 0">${p.photos.map(x=>`<img src="${x.d}">`).join("")}</div>
 <div class="row wrap" style="margin-bottom:10px">${p.lat?`<a class="btn" href="${gm(p)}" target="_blank">Open in Maps</a><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">Navigate</a>`:""}<button class="btn" onclick="navigator.clipboard?.writeText(gm(P('${id}')))">Copy location</button><button class="btn" onclick="share('${id}')">Share</button>${p.phone?`<a class="btn" href="tel:${esc(p.phone)}">Call</a><a class="btn" href="https://wa.me/${esc(p.phone.replace(/\D/g,""))}" target="_blank">WhatsApp</a>`:""}</div>
 <div class="card"><table><tr><td>Area</td><td>${p.area||"—"} ${p.unit} (${Math.round(sqft(p))} sq.ft)</td></tr><tr><td>Size</td><td>${p.len||"—"} × ${p.wid||"—"} · road ${p.road||"—"} · ${p.facing||"—"}</td></tr><tr><td>Price</td><td>${p.price||"—"} ${p.punit} → <b>${inr(total(p))}</b></td></tr><tr><td>Per cent / sq.ft</td><td>${inr(pc(p))} / ${inr(psf(p))}</td></tr><tr><td>Owner</td><td>${esc(p.owner)} ${esc(p.phone)}</td></tr><tr><td>Notes</td><td>${esc(p.notes)}</td></tr></table></div>
 <h2>Negotiated price & rating</h2><div class="row"><input id="neg" type="number" placeholder="Negotiated total ₹" value="${p.neg||""}"><select id="rt2"><option value="">Rating</option>${[1,2,3,4,5].map(n=>`<option ${p.rating==n?"selected":""}>${n}</option>`).join("")}</select><button class="btn" onclick="P('${id}').neg=$('neg').value;P('${id}').rating=$('rt2').value;save();detail('${id}')">Save</button></div>
 <h2>Change status</h2><div class="row"><select id="ns">${ST.map(s=>`<option ${s==p.status?"selected":""}>${s}</option>`).join("")}</select><input id="sn" placeholder="Note"><button class="btn p" onclick="setS('${id}')">Update</button></div>
 <div class="mut">${p.history.map(h=>`${dt(h.at)}: ${h.from||"—"} → ${h.to} ${esc(h.note||"")}`).join("<br>")}</div>
 <h2>Visits (${p.visits.length})</h2><textarea id="vn" rows="2" placeholder="What was discussed, new price, follow-up…"></textarea><button class="btn" onclick="visit('${id}')">Log new visit</button>
 <div class="mut" style="margin-top:8px">${p.visits.map(v=>`<b>${dt(v.at)}</b> ${esc(v.note)}`).join("<br>")}</div>
 <h2></h2><button class="btn d" onclick="if(confirm('Delete ${id}?')){db.props=db.props.filter(x=>x.id!='${id}');save();closeS()}">Delete property</button>`)}
function setS(id){const p=P(id),to=$("ns").value;if(to!=p.status){p.history.push({at:now(),from:p.status,to,note:$("sn").value});p.status=to;save()}detail(id)}
function visit(id){const n=$("vn").value.trim();if(!n)return;P(id).visits.push({at:now(),note:n});save();detail(id)}
function share(id){const p=P(id),t=`${p.id} · ${p.locality} ${p.type}\n${p.area||"—"} ${p.unit}, ${p.len||"—"}×${p.wid||"—"}, road ${p.road||"—"}, ${p.facing||"—"} facing\nPrice ${inr(total(p))} · ${p.status}\n${p.lat?gm(p):""}\n${p.notes||""}`;navigator.share?navigator.share({text:t}).catch(()=>{}):navigator.clipboard?.writeText(t).then(()=>alert("Summary copied (owner details excluded)"))}
render();
</script></body></html>
